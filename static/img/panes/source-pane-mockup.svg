<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340">
  <defs>
    <filter id="sourceShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="520" height="340" rx="12" fill="#1E1E1E" filter="url(#sourceShadow)"/>

  <!-- Title bar -->
  <rect width="520" height="40" rx="12" fill="#2D2D2D"/>
  <rect y="12" width="520" height="28" fill="#2D2D2D"/>

  <!-- Window controls -->
  <circle cx="20" cy="20" r="6" fill="#FF5F56"/>
  <circle cx="40" cy="20" r="6" fill="#FFBD2E"/>
  <circle cx="60" cy="20" r="6" fill="#27CA40"/>

  <!-- File name -->
  <text x="90" y="25" font-family="'SF Mono', Monaco, monospace" font-size="13" fill="#CCCCCC">profile/card.ttl</text>

  <!-- Format selector -->
  <rect x="340" y="10" width="70" height="22" rx="4" fill="#3C3C3C"/>
  <text x="375" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#CCCCCC">Turtle ▾</text>

  <!-- Action buttons -->
  <rect x="418" y="10" width="45" height="22" rx="4" fill="#3C3C3C"/>
  <text x="440" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#CCCCCC">Copy</text>

  <rect x="468" y="10" width="40" height="22" rx="4" fill="#3C3C3C"/>
  <text x="488" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#CCCCCC">⬇</text>

  <!-- Line numbers gutter -->
  <rect x="0" y="40" width="45" height="300" fill="#252526"/>

  <!-- Code area -->
  <g transform="translate(0, 55)" font-family="'SF Mono', Monaco, 'Cascadia Code', monospace" font-size="13">
    <!-- Line 1 -->
    <text x="20" y="0" fill="#858585" text-anchor="end">1</text>
    <text x="55" y="0" fill="#C586C0">@prefix</text>
    <text x="110" y="0" fill="#9CDCFE">foaf:</text>
    <text x="155" y="0" fill="#CE9178">&lt;http://xmlns.com/foaf/0.1/&gt;</text>
    <text x="395" y="0" fill="#CCCCCC">.</text>

    <!-- Line 2 -->
    <text x="20" y="22" fill="#858585" text-anchor="end">2</text>
    <text x="55" y="22" fill="#C586C0">@prefix</text>
    <text x="110" y="22" fill="#9CDCFE">solid:</text>
    <text x="160" y="22" fill="#CE9178">&lt;http://www.w3.org/ns/solid/terms#&gt;</text>
    <text x="445" y="22" fill="#CCCCCC">.</text>

    <!-- Line 3 - empty -->
    <text x="20" y="44" fill="#858585" text-anchor="end">3</text>

    <!-- Line 4 -->
    <text x="20" y="66" fill="#858585" text-anchor="end">4</text>
    <text x="55" y="66" fill="#569CD6">&lt;#me&gt;</text>

    <!-- Line 5 -->
    <text x="20" y="88" fill="#858585" text-anchor="end">5</text>
    <text x="75" y="88" fill="#CCCCCC">a</text>
    <text x="95" y="88" fill="#4EC9B0">foaf:Person</text>
    <text x="185" y="88" fill="#CCCCCC">;</text>

    <!-- Line 6 -->
    <text x="20" y="110" fill="#858585" text-anchor="end">6</text>
    <text x="75" y="110" fill="#9CDCFE">foaf:name</text>
    <text x="165" y="110" fill="#CE9178">"Alice Smith"</text>
    <text x="275" y="110" fill="#CCCCCC">;</text>

    <!-- Line 7 -->
    <text x="20" y="132" fill="#858585" text-anchor="end">7</text>
    <text x="75" y="132" fill="#9CDCFE">foaf:mbox</text>
    <text x="165" y="132" fill="#569CD6">&lt;mailto:alice@example.org&gt;</text>
    <text x="395" y="132" fill="#CCCCCC">;</text>

    <!-- Line 8 -->
    <text x="20" y="154" fill="#858585" text-anchor="end">8</text>
    <text x="75" y="154" fill="#9CDCFE">foaf:knows</text>
    <text x="170" y="154" fill="#569CD6">&lt;https://bob.example/#me&gt;</text>
    <text x="390" y="154" fill="#CCCCCC">;</text>

    <!-- Line 9 -->
    <text x="20" y="176" fill="#858585" text-anchor="end">9</text>
    <text x="75" y="176" fill="#9CDCFE">solid:oidcIssuer</text>
    <text x="205" y="176" fill="#569CD6">&lt;https://solidcommunity.net&gt;</text>
    <text x="445" y="176" fill="#CCCCCC">.</text>

    <!-- Line 10 - empty -->
    <text x="20" y="198" fill="#858585" text-anchor="end">10</text>

    <!-- Line 11 - comment -->
    <text x="20" y="220" fill="#858585" text-anchor="end">11</text>
    <text x="55" y="220" fill="#6A9955"># End of profile</text>
  </g>

  <!-- Cursor line highlight -->
  <rect x="45" y="145" width="475" height="20" fill="rgba(255,255,255,0.04)"/>

  <!-- Edit indicator -->
  <circle cx="505" cy="325" r="8" fill="#7C3AED"/>
  <text x="505" y="329" text-anchor="middle" font-size="10" fill="#ffffff">✎</text>
</svg>