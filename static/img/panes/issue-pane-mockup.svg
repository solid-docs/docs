<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <filter id="issueShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="480" rx="12" fill="#ffffff" filter="url(#issueShadow)"/>

  <!-- Header -->
  <rect width="480" height="80" rx="12" fill="#FEF2F2"/>
  <rect y="12" width="480" height="68" fill="#FEF2F2"/>

  <!-- Bug icon and title -->
  <g transform="translate(20, 20)">
    <circle cx="20" cy="20" r="20" fill="#FEE2E2"/>
    <text x="20" y="26" text-anchor="middle" font-size="18">🐛</text>
  </g>
  <text x="70" y="35" font-family="system-ui, sans-serif" font-size="11" fill="#991B1B" font-weight="600">#42</text>
  <text x="100" y="35" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1F2937">Fix login redirect bug</text>

  <!-- Status badges -->
  <g transform="translate(70, 45)">
    <rect width="55" height="22" rx="4" fill="#DCFCE7"/>
    <text x="27" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#166534">Open</text>

    <rect x="62" width="80" height="22" rx="4" fill="#FEE2E2"/>
    <text x="102" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#991B1B">High Priority</text>

    <rect x="150" width="90" height="22" rx="4" fill="#DBEAFE"/>
    <circle cx="165" cy="11" r="8" fill="#BFDBFE"/>
    <text x="165" y="15" text-anchor="middle" font-size="8" font-weight="500" fill="#1D4ED8">A</text>
    <text x="205" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1D4ED8">Alice</text>
  </g>

  <!-- Description -->
  <text x="20" y="110" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="0.5">DESCRIPTION</text>

  <rect x="20" y="120" width="440" height="80" rx="8" fill="#F9FAFB"/>
  <text x="32" y="142" font-family="system-ui, sans-serif" font-size="13" fill="#374151">When logging in from the /settings page, users are</text>
  <text x="32" y="160" font-family="system-ui, sans-serif" font-size="13" fill="#374151">redirected to the homepage instead of back to /settings.</text>
  <text x="32" y="185" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280" font-style="italic">Expected: Return to original page after login</text>

  <!-- Steps to reproduce -->
  <text x="20" y="225" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="0.5">STEPS TO REPRODUCE</text>

  <g transform="translate(20, 235)">
    <rect width="440" height="90" rx="8" fill="#F9FAFB"/>
    <text x="16" y="22" font-family="system-ui, sans-serif" font-size="13" fill="#374151">1. Go to /settings while logged out</text>
    <text x="16" y="42" font-family="system-ui, sans-serif" font-size="13" fill="#374151">2. Click "Login"</text>
    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="13" fill="#374151">3. Complete login flow</text>
    <text x="16" y="82" font-family="system-ui, sans-serif" font-size="13" fill="#374151">4. Observe redirect to / instead of /settings</text>
  </g>

  <!-- Comments section -->
  <text x="20" y="350" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="0.5">COMMENTS (2)</text>

  <!-- Comment 1 -->
  <g transform="translate(20, 360)">
    <circle cx="16" cy="16" r="14" fill="#FCE7F3"/>
    <text x="16" y="21" text-anchor="middle" font-size="10" font-weight="500" fill="#DB2777">B</text>
    <rect x="40" y="0" width="400" height="35" rx="8" fill="#F9FAFB"/>
    <text x="52" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#374151">Bob</text>
    <text x="80" y="15" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">· Jan 14</text>
    <text x="52" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#4B5563">I can reproduce this on Chrome and Firefox</text>
  </g>

  <!-- Comment 2 -->
  <g transform="translate(20, 405)">
    <circle cx="16" cy="16" r="14" fill="#DBEAFE"/>
    <text x="16" y="21" text-anchor="middle" font-size="10" font-weight="500" fill="#2563EB">A</text>
    <rect x="40" y="0" width="400" height="35" rx="8" fill="#F9FAFB"/>
    <text x="52" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#374151">Alice</text>
    <text x="88" y="15" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">· Jan 15</text>
    <text x="52" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#4B5563">Working on a fix, PR coming soon</text>
  </g>

  <!-- Add comment button -->
  <rect x="20" y="450" width="120" height="32" rx="6" fill="#7C3AED"/>
  <text x="80" y="471" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#ffffff">+ Add Comment</text>
</svg>