<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="480" height="520">
  <defs>
    <linearGradient id="meetingHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <filter id="meetingShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="520" rx="12" fill="#ffffff" filter="url(#meetingShadow)"/>

  <!-- Header -->
  <rect width="480" height="90" rx="12" fill="url(#meetingHeaderGrad)"/>
  <rect y="12" width="480" height="78" fill="url(#meetingHeaderGrad)"/>

  <!-- Meeting title -->
  <text x="24" y="35" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">📅 MEETING</text>
  <text x="24" y="58" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Weekly Team Sync</text>
  <text x="24" y="78" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.9)">Monday, Jan 15, 2024 · 10:00 AM</text>

  <!-- Participants -->
  <g transform="translate(340, 35)">
    <circle cx="0" cy="20" r="18" fill="#DBEAFE"/>
    <text x="0" y="25" text-anchor="middle" font-size="12" font-weight="500" fill="#2563EB">A</text>
    <circle cx="28" cy="20" r="18" fill="#FCE7F3"/>
    <text x="28" y="25" text-anchor="middle" font-size="12" font-weight="500" fill="#DB2777">B</text>
    <circle cx="56" cy="20" r="18" fill="#D1FAE5"/>
    <text x="56" y="25" text-anchor="middle" font-size="12" font-weight="500" fill="#059669">C</text>
    <circle cx="84" cy="20" r="18" fill="#F3F4F6"/>
    <text x="84" y="25" text-anchor="middle" font-size="11" fill="#6B7280">+2</text>
  </g>

  <!-- Agenda Section -->
  <text x="24" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="0.5">AGENDA</text>

  <!-- Agenda items -->
  <g transform="translate(24, 135)">
    <!-- Item 1 - checked -->
    <rect width="432" height="40" rx="8" fill="#F0FDF4"/>
    <rect x="12" y="12" width="16" height="16" rx="4" fill="#22C55E"/>
    <text x="20" y="23" text-anchor="middle" font-size="10" fill="#ffffff">✓</text>
    <text x="40" y="25" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Review last week's action items</text>

    <!-- Item 2 -->
    <rect y="48" width="432" height="40" rx="8" fill="#F8FAFC"/>
    <rect x="12" y="60" width="16" height="16" rx="4" fill="#ffffff" stroke="#D1D5DB" stroke-width="1"/>
    <text x="40" y="73" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Project status updates</text>

    <!-- Item 3 -->
    <rect y="96" width="432" height="40" rx="8" fill="#F8FAFC"/>
    <rect x="12" y="108" width="16" height="16" rx="4" fill="#ffffff" stroke="#D1D5DB" stroke-width="1"/>
    <text x="40" y="121" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Discuss Q2 planning</text>

    <!-- Item 4 -->
    <rect y="144" width="432" height="40" rx="8" fill="#F8FAFC"/>
    <rect x="12" y="156" width="16" height="16" rx="4" fill="#ffffff" stroke="#D1D5DB" stroke-width="1"/>
    <text x="40" y="169" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Any other business</text>
  </g>

  <!-- Action Items Section -->
  <text x="24" y="340" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="0.5">ACTION ITEMS</text>

  <g transform="translate(24, 355)">
    <!-- Action 1 -->
    <rect width="432" height="50" rx="8" fill="#FEF3C7"/>
    <circle cx="20" cy="25" r="14" fill="#DBEAFE"/>
    <text x="20" y="30" text-anchor="middle" font-size="10" font-weight="500" fill="#2563EB">A</text>
    <text x="44" y="22" font-family="system-ui, sans-serif" font-size="13" fill="#374151">Complete documentation</text>
    <text x="44" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Due: Jan 20</text>
    <rect x="350" y="15" width="70" height="22" rx="4" fill="#FCD34D"/>
    <text x="385" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#78350F">In Progress</text>

    <!-- Action 2 -->
    <rect y="58" width="432" height="50" rx="8" fill="#F3E8FF"/>
    <circle cx="20" cy="83" r="14" fill="#FCE7F3"/>
    <text x="20" y="88" text-anchor="middle" font-size="10" font-weight="500" fill="#DB2777">B</text>
    <text x="44" y="80" font-family="system-ui, sans-serif" font-size="13" fill="#374151">Review pull requests</text>
    <text x="44" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#6B7280">Due: Jan 17</text>
    <rect x="350" y="73" width="70" height="22" rx="4" fill="#E9D5FF"/>
    <text x="385" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#6B21A8">Pending</text>
  </g>

  <!-- Add buttons -->
  <g transform="translate(24, 475)">
    <rect width="140" height="32" rx="6" fill="#7C3AED"/>
    <text x="70" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#ffffff">+ Add Agenda Item</text>

    <rect x="150" width="150" height="32" rx="6" fill="#F3F4F6"/>
    <text x="225" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#374151">+ Add Action Item</text>
  </g>
</svg>