<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="solidGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Main hexagon shape representing the "OS" container -->
  <polygon
    points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5"
    fill="url(#solidGradient)"
    stroke="none"
  />
  <!-- Inner connected nodes representing data/panes -->
  <circle cx="50" cy="35" r="8" fill="white" opacity="0.9"/>
  <circle cx="35" cy="60" r="8" fill="white" opacity="0.9"/>
  <circle cx="65" cy="60" r="8" fill="white" opacity="0.9"/>
  <!-- Connection lines -->
  <line x1="50" y1="35" x2="35" y2="60" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="50" y1="35" x2="65" y2="60" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="35" y1="60" x2="65" y2="60" stroke="white" stroke-width="2" opacity="0.7"/>
</svg>
