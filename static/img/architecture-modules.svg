<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <linearGradient id="mashlibMod" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="panesMod" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="uiMod" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="logicMod" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D97706;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="rdflibMod" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:0.05" />
    </linearGradient>
    <marker id="dependency" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666" opacity="0.6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="450" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#333" text-anchor="middle">Module Boundaries & Dependencies</text>

  <!-- mashlib (top) -->
  <rect x="250" y="80" width="400" height="100" rx="8" fill="url(#mashlibMod)" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="450" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#7C3AED" text-anchor="middle">mashlib</text>
  <text x="450" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#555" text-anchor="middle">Depends on: solid-panes, solid-ui, solid-logic</text>
  <text x="450" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#555" text-anchor="middle">Exports: panes global, runDataBrowser()</text>

  <!-- solid-panes -->
  <rect x="50" y="230" width="250" height="100" rx="8" fill="url(#panesMod)" stroke="#2563EB" stroke-width="2.5"/>
  <text x="175" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#2563EB" text-anchor="middle">solid-panes</text>
  <text x="175" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555" text-anchor="middle">Depends on: solid-ui,</text>
  <text x="175" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555" text-anchor="middle">solid-logic, pane-registry</text>
  <text x="175" y="319" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555" text-anchor="middle">Exports: registerPanes, panes</text>

  <!-- solid-ui -->
  <rect x="325" y="230" width="250" height="100" rx="8" fill="url(#uiMod)" stroke="#059669" stroke-width="2.5"/>
  <text x="450" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">solid-ui</text>
  <text x="450" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555" text-anchor="middle">Depends on: solid-logic, rdflib</text>
  <text x="450" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555" text-anchor="middle">Exports: UI.widgets,</text>
  <text x="450" y="319" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555" text-anchor="middle">UI.forms, UI.style</text>

  <!-- solid-logic -->
  <rect x="600" y="230" width="250" height="100" rx="8" fill="url(#logicMod)" stroke="#D97706" stroke-width="2.5"/>
  <text x="725" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#D97706" text-anchor="middle">solid-logic</text>
  <text x="725" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555" text-anchor="middle">Depends on: rdflib</text>
  <text x="725" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555" text-anchor="middle">Exports: store, authn,</text>
  <text x="725" y="319" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555" text-anchor="middle">acl, typeIndex</text>

  <!-- rdflib (bottom) -->
  <rect x="250" y="380" width="400" height="100" rx="8" fill="url(#rdflibMod)" stroke="#DC2626" stroke-width="2.5"/>
  <text x="450" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#DC2626" text-anchor="middle">rdflib</text>
  <text x="450" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#555" text-anchor="middle">No Solid-specific dependencies</text>
  <text x="450" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#555" text-anchor="middle">Exports: graph, Fetcher, UpdateManager, NamedNode, etc.</text>

  <!-- Dependency arrows from mashlib -->
  <path d="M 350 180 Q 250 205 220 230" fill="none" stroke="#666" stroke-width="2" opacity="0.5" marker-end="url(#dependency)"/>
  <line x1="450" y1="180" x2="450" y2="230" stroke="#666" stroke-width="2" opacity="0.5" marker-end="url(#dependency)"/>
  <path d="M 550 180 Q 650 205 680 230" fill="none" stroke="#666" stroke-width="2" opacity="0.5" marker-end="url(#dependency)"/>

  <!-- Dependency arrows from solid-panes -->
  <path d="M 250 330 Q 350 355 390 380" fill="none" stroke="#666" stroke-width="2" opacity="0.5" marker-end="url(#dependency)"/>
  <line x1="280" y1="280" x2="380" y2="280" stroke="#666" stroke-width="2" opacity="0.5" marker-end="url(#dependency)"/>
  <path d="M 250 260 Q 350 245 600 260" fill="none" stroke="#666" stroke-width="2" opacity="0.5" marker-end="url(#dependency)"/>

  <!-- Dependency arrows from solid-ui -->
  <line x1="450" y1="330" x2="450" y2="380" stroke="#666" stroke-width="2" opacity="0.5" marker-end="url(#dependency)"/>
  <path d="M 520 280 Q 600 265 600 270" fill="none" stroke="#666" stroke-width="2" opacity="0.5" marker-end="url(#dependency)"/>

  <!-- Dependency arrow from solid-logic -->
  <path d="M 650 330 Q 550 355 510 380" fill="none" stroke="#666" stroke-width="2" opacity="0.5" marker-end="url(#dependency)"/>

  <!-- Legend -->
  <rect x="50" y="540" width="800" height="130" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="450" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#333" text-anchor="middle">Key Characteristics</text>

  <!-- Legend items -->
  <text x="70" y="595" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#7C3AED">mashlib:</text>
  <text x="140" y="595" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#555">Entry point bundle, orchestrates all modules</text>

  <text x="70" y="618" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2563EB">solid-panes:</text>
  <text x="165" y="618" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#555">View layer with built-in panes (contacts, chat, folder, etc.)</text>

  <text x="70" y="641" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#059669">solid-ui:</text>
  <text x="140" y="641" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#555">Reusable UI widgets and form generators</text>

  <text x="470" y="595" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#D97706">solid-logic:</text>
  <text x="565" y="595" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#555">Business logic (auth, ACLs, type indexes)</text>

  <text x="470" y="618" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#DC2626">rdflib:</text>
  <text x="530" y="618" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#555">Core RDF graph database, fetcher, and query engine</text>

  <line x1="470" y1="631" x2="510" y2="631" stroke="#666" stroke-width="2" opacity="0.5" marker-end="url(#dependency)"/>
  <text x="520" y="636" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#555">= "depends on" relationship</text>
</svg>
